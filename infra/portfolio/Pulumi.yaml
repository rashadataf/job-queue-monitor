name: job-queue-monitor
description: Job Queue Monitor app stack attached to portfolio Traefik/core infra
stackConfigDir: ../configs/portfolio
runtime: yaml

config: {
    "pulumi:tags": { value: { "pulumi:template": yaml } },
    "CORE_STACK_NAME": { type: "string" },
    "API_APP_PORT": { type: "string", default: "3000" },
    "API_HOST_PORT": { type: "string", default: "3000" },
    "UI_APP_PORT": { type: "string", default: "5173" },
    "UI_HOST_PORT": { type: "string", default: "5173" },
    "BUILD_PHASE_TARGET": { type: "string", value: "development" },
    # Defaults are production-safe (do not mask the baked production image contents).
    # Dev stacks should override these to mount into /usr/src/app/{api,shared}.
    "API_CODE_MOUNT_TARGET":
      { type: "string", default: "/usr/src/app/_dev/api" },
    "SHARED_CODE_MOUNT_TARGET":
      { type: "string", default: "/usr/src/app/_dev/shared" },
    "API_NODE_MODULES_MOUNT_TARGET":
      { type: "string", default: "/usr/src/app/_dev/api/node_modules" },
    "SHARED_NODE_MODULES_MOUNT_TARGET":
      { type: "string", default: "/usr/src/app/_dev/shared/node_modules" },
    "DB_NAME": { type: "string", secret: true },
    "DB_USER": { type: "string", secret: true },
    "DB_PASSWORD": { type: "string", secret: true },
    "DB_PORT": { type: "string", secret: true },
    "REDIS_PORT": { type: "string", default: "6379" },
    "SUB_DOMAIN": { type: "string", default: "jobs" },
  } # e.g. portfolio-infra/dev

variables:
  {
    PORTFOLIO_NETWORK_NAME: "${coreStack.outputs.appNetworkName}",
    CORE_STACK_NAME: "${CORE_STACK_NAME}",
    API_APP_PORT: "${API_APP_PORT}",
    API_HOST_PORT: "${API_HOST_PORT}",
    UI_APP_PORT: "${UI_APP_PORT}",
    UI_HOST_PORT: "${UI_HOST_PORT}",
    BUILD_PHASE_TARGET: "${BUILD_PHASE_TARGET}",
    API_CODE_MOUNT_TARGET: "${API_CODE_MOUNT_TARGET}",
    SHARED_CODE_MOUNT_TARGET: "${SHARED_CODE_MOUNT_TARGET}",
    API_NODE_MODULES_MOUNT_TARGET: "${API_NODE_MODULES_MOUNT_TARGET}",
    SHARED_NODE_MODULES_MOUNT_TARGET: "${SHARED_NODE_MODULES_MOUNT_TARGET}",
    APP_NETWORK_NAME: "${pulumi.project}-network",
    DOMAIN_NAME: "${coreStack.outputs.domainName}",
    ROUTER_ENTRYPOINT: "${coreStack.outputs.routerEntrypoint}",
    ENABLE_TLS: "${coreStack.outputs.enableTls}",
    PROTOCOL: "${coreStack.outputs.protocol}",
    DB_NAME: "${DB_NAME}",
    DB_USER: "${DB_USER}",
    DB_PASSWORD: "${DB_PASSWORD}",
    DB_PORT: "${DB_PORT}",
    DB_HOST: "db",
    REDIS_HOST: "redis",
    REDIS_PORT: "${REDIS_PORT}",
    SUB_DOMAIN: "${SUB_DOMAIN}",
    API_URL: "${PROTOCOL}://${SUB_DOMAIN}.${DOMAIN_NAME}/api",
    API_SOCKET_URL: "${PROTOCOL}://${SUB_DOMAIN}.${DOMAIN_NAME}",
    CORS_ORIGIN: "${PROTOCOL}://${DOMAIN_NAME},${PROTOCOL}://www.${DOMAIN_NAME},${PROTOCOL}://${SUB_DOMAIN}.${DOMAIN_NAME},${PROTOCOL}://www.${SUB_DOMAIN}.${DOMAIN_NAME}",
  }

resources:
  {
    coreStack:
      {
        type: "pulumi:pulumi:StackReference",
        properties: { name: "${CORE_STACK_NAME}" },
      },
    jobQueueNetwork:
      { type: "docker:Network", properties: { name: "${APP_NETWORK_NAME}" } },
    jobQueueApiNodeModulesVolume:
      {
        type: "docker:Volume",
        properties: { name: "job_queue_monitor_api_node_modules" },
      },
    jobQueueUiNodeModulesVolume:
      {
        type: "docker:Volume",
        properties: { name: "job_queue_monitor_ui_node_modules" },
      },
    jobQueueSharedNodeModulesVolume:
      {
        type: "docker:Volume",
        properties: { name: "job_queue_monitor_shared_node_modules" },
      },
    jobQueueApiImage:
      {
        type: "docker:RemoteImage",
        properties:
          {
            name: "job-queue-monitor-api-portfolio",
            build:
              {
                context: "../..",
                dockerfile: "api/Dockerfile",
                platform: "linux/amd64",
                target: "${BUILD_PHASE_TARGET}",
                buildArgs: { APP_PORT: "${API_APP_PORT}" },
              },
          },
      },
    jobQueueUiImage:
      {
        type: "docker:RemoteImage",
        properties:
          {
            name: "job-queue-monitor-ui-portfolio",
            build:
              {
                context: "../..",
                dockerfile: "ui/Dockerfile",
                platform: "linux/amd64",
                target: "${BUILD_PHASE_TARGET}",
                buildArgs: { APP_PORT: "${UI_APP_PORT}" },
              },
          },
      },
    jobQueueApiContainer:
      {
        type: "docker:Container",
        properties:
          {
            name: "job-queue-monitor-api-portfolio-${pulumi.stack}",
            image: "${jobQueueApiImage.imageId}",
            restart: "always",
            networksAdvanced:
              [
                { name: "${APP_NETWORK_NAME}" },
                { name: "${PORTFOLIO_NETWORK_NAME}" },
              ],
            envs:
              [
                "DB_HOST=${DB_HOST}",
                "DB_PORT=${DB_PORT}",
                "DB_NAME=${DB_NAME}",
                "DB_USER=${DB_USER}",
                "DB_PASSWORD=${DB_PASSWORD}",
                "REDIS_HOST=${REDIS_HOST}",
                "REDIS_PORT=${REDIS_PORT}",
                "CORS_ORIGIN=${CORS_ORIGIN}",
              ],
            labels:
              [
                { label: "traefik.enable", value: "true" },
                {
                  label: "traefik.docker.network",
                  value: "${PORTFOLIO_NETWORK_NAME}",
                },
                {
                  label: "traefik.http.services.job-queue-monitor-api.loadbalancer.server.port",
                  value: "${API_APP_PORT}",
                },

                {
                  label: "traefik.http.middlewares.job-queue-monitor-api-strip.stripprefix.prefixes",
                  value: "/api",
                },

                {
                  label: "traefik.http.routers.job-queue-monitor-api.rule",
                  value: "Host(`${SUB_DOMAIN}.${DOMAIN_NAME}`) && PathPrefix(`/api`)",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api.entrypoints",
                  value: "${ROUTER_ENTRYPOINT}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api.service",
                  value: "job-queue-monitor-api",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api.priority",
                  value: "100",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api.middlewares",
                  value: "job-queue-monitor-api-strip",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api.tls",
                  value: "${ENABLE_TLS}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api.tls.certresolver",
                  value: "letsencrypt",
                },

                {
                  label: "traefik.http.routers.job-queue-monitor-api-www.rule",
                  value: "Host(`www.${SUB_DOMAIN}.${DOMAIN_NAME}`) && PathPrefix(`/api`)",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api-www.entrypoints",
                  value: "${ROUTER_ENTRYPOINT}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api-www.service",
                  value: "job-queue-monitor-api",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api-www.priority",
                  value: "100",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api-www.middlewares",
                  value: "job-queue-monitor-api-strip",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api-www.tls",
                  value: "${ENABLE_TLS}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-api-www.tls.certresolver",
                  value: "letsencrypt",
                },

                {
                  label: "traefik.http.routers.job-queue-monitor-socket.rule",
                  value: "Host(`${SUB_DOMAIN}.${DOMAIN_NAME}`) && PathPrefix(`/socket.io`)",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-socket.entrypoints",
                  value: "${ROUTER_ENTRYPOINT}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-socket.service",
                  value: "job-queue-monitor-api",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-socket.priority",
                  value: "110",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-socket.tls",
                  value: "${ENABLE_TLS}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-socket.tls.certresolver",
                  value: "letsencrypt",
                },

                {
                  label: "traefik.http.routers.job-queue-monitor-socket-www.rule",
                  value: "Host(`www.${SUB_DOMAIN}.${DOMAIN_NAME}`) && PathPrefix(`/socket.io`)",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-socket-www.entrypoints",
                  value: "${ROUTER_ENTRYPOINT}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-socket-www.service",
                  value: "job-queue-monitor-api",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-socket-www.priority",
                  value: "110",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-socket-www.tls",
                  value: "${ENABLE_TLS}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-socket-www.tls.certresolver",
                  value: "letsencrypt",
                },
              ],
            mounts:
              [
                {
                  type: "bind",
                  source: "${pulumi.cwd}/../../api",
                  target: "${API_CODE_MOUNT_TARGET}",
                },
                {
                  type: "bind",
                  source: "${pulumi.cwd}/../../shared",
                  target: "${SHARED_CODE_MOUNT_TARGET}",
                },
                {
                  type: "volume",
                  source: "${jobQueueApiNodeModulesVolume.name}",
                  target: "${API_NODE_MODULES_MOUNT_TARGET}",
                },
                {
                  type: "volume",
                  source: "${jobQueueSharedNodeModulesVolume.name}",
                  target: "${SHARED_NODE_MODULES_MOUNT_TARGET}",
                },
              ],
            ports:
              [{ internal: "${API_APP_PORT}", external: "${API_HOST_PORT}" }],
          },
      },

    jobQueueApiDebugContainer:
      {
        type: "docker:Container",
        properties:
          {
            name: "job-queue-monitor-api-debug-portfolio-${pulumi.stack}",
            image: "${jobQueueApiImage.imageId}",
            restart: "always",
            networksAdvanced:
              [
                { name: "${APP_NETWORK_NAME}" },
                { name: "${PORTFOLIO_NETWORK_NAME}" },
              ],
            command: ["tail", "-f", "/dev/null"],
          },
      },

    jobQueueUiContainer:
      {
        type: "docker:Container",
        properties:
          {
            name: "job-queue-monitor-ui-portfolio-${pulumi.stack}",
            image: "${jobQueueUiImage.imageId}",
            restart: "always",
            networksAdvanced:
              [
                { name: "${APP_NETWORK_NAME}" },
                { name: "${PORTFOLIO_NETWORK_NAME}" },
              ],
            envs:
              [
                "VITE_API_URL=/api",
                "VITE_SOCKET_URL=${PROTOCOL}://${SUB_DOMAIN}.${DOMAIN_NAME}",
              ],
            mounts:
              [
                {
                  type: "bind",
                  source: "${pulumi.cwd}/../../ui",
                  target: "/usr/src/app/ui",
                },
                {
                  type: "bind",
                  source: "${pulumi.cwd}/../../shared",
                  target: "/usr/src/app/shared",
                },
                {
                  type: "volume",
                  source: "${jobQueueUiNodeModulesVolume.name}",
                  target: "/usr/src/app/ui/node_modules",
                },
                {
                  type: "volume",
                  source: "${jobQueueSharedNodeModulesVolume.name}",
                  target: "/usr/src/app/shared/node_modules",
                },
              ],
            labels:
              [
                { label: "traefik.enable", value: "true" },
                {
                  label: "traefik.docker.network",
                  value: "${PORTFOLIO_NETWORK_NAME}",
                },
                {
                  label: "traefik.http.services.job-queue-monitor-ui.loadbalancer.server.port",
                  value: "${UI_APP_PORT}",
                },

                {
                  label: "traefik.http.routers.job-queue-monitor-ui.entrypoints",
                  value: "${ROUTER_ENTRYPOINT}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-ui.rule",
                  value: "Host(`${SUB_DOMAIN}.${DOMAIN_NAME}`) && !PathPrefix(`/api`) && !PathPrefix(`/socket.io`)",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-ui.priority",
                  value: "1",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-ui.service",
                  value: "job-queue-monitor-ui",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-ui.tls",
                  value: "${ENABLE_TLS}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-ui.tls.certresolver",
                  value: "letsencrypt",
                },

                {
                  label: "traefik.http.routers.job-queue-monitor-ui-www.entrypoints",
                  value: "${ROUTER_ENTRYPOINT}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-ui-www.rule",
                  value: "Host(`www.${SUB_DOMAIN}.${DOMAIN_NAME}`) && !PathPrefix(`/api`) && !PathPrefix(`/socket.io`)",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-ui-www.priority",
                  value: "1",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-ui-www.service",
                  value: "job-queue-monitor-ui",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-ui-www.tls",
                  value: "${ENABLE_TLS}",
                },
                {
                  label: "traefik.http.routers.job-queue-monitor-ui-www.tls.certresolver",
                  value: "letsencrypt",
                },
              ],
          },
      },
    db:
      {
        type: "db:PostgresDb",
        properties:
          {
            projectName: "${pulumi.project}",
            stackName: "${pulumi.stack}",
            networkName: "${APP_NETWORK_NAME}",
            dbName: "${DB_NAME}",
            dbUser: "${DB_USER}",
            dbPassword: "${DB_PASSWORD}",
            dbPort: "${DB_PORT}",
            dbNetworkAlias: "${DB_HOST}",
          },
      },
    redis:
      {
        type: "redis:Redis",
        properties:
          {
            projectName: "${pulumi.project}",
            stackName: "${pulumi.stack}",
            networkName: "${APP_NETWORK_NAME}",
            redisNetworkAlias: "${REDIS_HOST}",
            redisPort: "${REDIS_PORT}",
          },
      },
    shared:
      {
        type: "shared:Shared",
        properties:
          {
            projectName: "${pulumi.project}",
            stackName: "${pulumi.stack}",
            jobQueueSharedNodeModulesVolumeName: "${jobQueueSharedNodeModulesVolume.name}",
          },
      },
  }
packages:
  {
    db: "../components/db",
    redis: "../components/redis",
    shared: "../components/shared",
  }
outputs: {}
