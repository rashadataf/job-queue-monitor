name: job-queue-monitor-standalone
description: Standalone infra for job-queue-monitor (no portfolio stack, no Traefik)
stackConfigDir: ../configs
runtime: yaml

config:
  {
    "pulumi:tags": { value: { "pulumi:template": yaml } },
    "API_APP_PORT": { type: "string", default: "3000" },
    "API_HOST_PORT": { type: "string", default: "3000" },
    "UI_APP_PORT": { type: "string", default: "5173" },
    "UI_HOST_PORT": { type: "string", default: "5173" },
    "BUILD_PHASE_TARGET": { type: "string", default: "development" },
    "DB_NAME": { type: "string", default: "job_queue_monitor" },
    "DB_USER": { type: "string", default: "job_queue_monitor" },
    "DB_PASSWORD": { type: "string", default: "job_queue_monitor" },
    "DB_PORT": { type: "string", default: "5432" },
    "REDIS_PORT": { type: "string", default: "6379" },
  }

variables:
  {
    API_APP_PORT: "${API_APP_PORT}",
    API_HOST_PORT: "${API_HOST_PORT}",
    UI_APP_PORT: "${UI_APP_PORT}",
    UI_HOST_PORT: "${UI_HOST_PORT}",
    BUILD_PHASE_TARGET: "${BUILD_PHASE_TARGET}",
    APP_NETWORK_NAME: "${pulumi.project}-network",
    DB_NAME: "${DB_NAME}",
    DB_USER: "${DB_USER}",
    DB_PASSWORD: "${DB_PASSWORD}",
    DB_PORT: "${DB_PORT}",
    DB_HOST: "db",
    REDIS_HOST: "redis",
    REDIS_PORT: "${REDIS_PORT}",
  }

resources:
  {
    jobQueueNetwork:
      { type: "docker:Network", properties: { name: "${APP_NETWORK_NAME}" } },
    jobQueueApiNodeModulesVolume:
      {
        type: "docker:Volume",
        properties: { name: "job_queue_monitor_api_node_modules_standalone" },
      },
    jobQueueUiNodeModulesVolume:
      {
        type: "docker:Volume",
        properties: { name: "job_queue_monitor_ui_node_modules_standalone" },
      },
    jobQueueSharedNodeModulesVolume:
      {
        type: "docker:Volume",
        properties:
          { name: "job_queue_monitor_shared_node_modules_standalone" },
      },
    jobQueueApiImage:
      {
        type: "docker:RemoteImage",
        properties:
          {
            name: "job-queue-monitor-api-standalone",
            build:
              {
                context: "../..",
                dockerfile: "api/Dockerfile",
                platform: "linux/amd64",
                target: "${BUILD_PHASE_TARGET}",
                buildArgs: { APP_PORT: "${API_APP_PORT}" },
              },
          },
      },
    jobQueueUiImage:
      {
        type: "docker:RemoteImage",
        properties:
          {
            name: "job-queue-monitor-ui-standalone",
            build:
              {
                context: "../..",
                dockerfile: "ui/Dockerfile",
                platform: "linux/amd64",
                target: "${BUILD_PHASE_TARGET}",
                buildArgs: { APP_PORT: "${UI_APP_PORT}" },
              },
          },
      },
    jobQueueApiContainer:
      {
        type: "docker:Container",
        properties:
          {
            name: "job-queue-monitor-api-standalone-${pulumi.stack}",
            image: "${jobQueueApiImage.imageId}",
            restart: "always",
            networksAdvanced: [{ name: "${APP_NETWORK_NAME}" }],
            envs:
              [
                "DB_HOST=${DB_HOST}",
                "DB_PORT=${DB_PORT}",
                "DB_NAME=${DB_NAME}",
                "DB_USER=${DB_USER}",
                "DB_PASSWORD=${DB_PASSWORD}",
                "REDIS_HOST=${REDIS_HOST}",
                "REDIS_PORT=${REDIS_PORT}",
              ],
            mounts:
              [
                {
                  type: "bind",
                  source: "${pulumi.cwd}/../../api",
                  target: "/usr/src/app/api",
                },
                {
                  type: "bind",
                  source: "${pulumi.cwd}/../../shared",
                  target: "/usr/src/app/shared",
                },
                {
                  type: "volume",
                  source: "${jobQueueApiNodeModulesVolume.name}",
                  target: "/usr/src/app/api/node_modules",
                },
                {
                  type: "volume",
                  source: "${jobQueueSharedNodeModulesVolume.name}",
                  target: "/usr/src/app/shared/node_modules",
                },
              ],
            ports:
              [{ internal: "${API_APP_PORT}", external: "${API_HOST_PORT}" }],
          },
      },
    jobQueueUiContainer:
      {
        type: "docker:Container",
        properties:
          {
            name: "job-queue-monitor-ui-standalone-${pulumi.stack}",
            image: "${jobQueueUiImage.imageId}",
            restart: "always",
            networksAdvanced: [{ name: "${APP_NETWORK_NAME}" }],
            mounts:
              [
                {
                  type: "bind",
                  source: "${pulumi.cwd}/../../ui",
                  target: "/usr/src/app/ui",
                },
                {
                  type: "bind",
                  source: "${pulumi.cwd}/../../shared",
                  target: "/usr/src/app/shared",
                },
                {
                  type: "volume",
                  source: "${jobQueueUiNodeModulesVolume.name}",
                  target: "/usr/src/app/ui/node_modules",
                },
                {
                  type: "volume",
                  source: "${jobQueueSharedNodeModulesVolume.name}",
                  target: "/usr/src/app/shared/node_modules",
                },
              ],
            ports:
              [{ internal: "${UI_APP_PORT}", external: "${UI_HOST_PORT}" }],
          },
      },
    db:
      {
        type: "db:PostgresDb",
        properties:
          {
            projectName: "${pulumi.project}",
            stackName: "${pulumi.stack}",
            networkName: "${APP_NETWORK_NAME}",
            dbName: "${DB_NAME}",
            dbUser: "${DB_USER}",
            dbPassword: "${DB_PASSWORD}",
            dbPort: "${DB_PORT}",
            dbNetworkAlias: "${DB_HOST}",
          },
      },
    redis:
      {
        type: "redis:Redis",
        properties:
          {
            projectName: "${pulumi.project}",
            stackName: "${pulumi.stack}",
            networkName: "${APP_NETWORK_NAME}",
            redisNetworkAlias: "${REDIS_HOST}",
            redisPort: "${REDIS_PORT}",
          },
      },
  }
packages: { db: "../components/db", redis: "../components/redis" }
outputs:
  {
    apiUrl: "http://localhost:${API_HOST_PORT}",
    uiUrl: "http://localhost:${UI_HOST_PORT}",
  }
